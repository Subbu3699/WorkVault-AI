
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: workvault-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workvault
      POSTGRES_USER: workvault_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - workvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workvault_user -d workvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workvault_pgdata:
